name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      dockerfile_variant:
        description: "Dockerfileの種類"
        required: true
        type: choice
        options:
          - node
      tag:
        description: "Dockerイメージのタグ (省略時は YYMMDD)"
        required: false
        default: ""
      latest:
        description: "latestタグを追加するか"
        required: false
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up variables
        id: vars
        env:
          INPUT_DOCKERFILE_VARIANT: ${{ github.event.inputs.dockerfile_variant }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_LATEST: ${{ github.event.inputs.latest }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          VARIANT="$INPUT_DOCKERFILE_VARIANT"
          DATE=$(date "+%y%m%d")

          if [ -z "$INPUT_TAG" ]; then
            TAG="$DATE"
          else
            TAG="$INPUT_TAG"
          fi

          if ! echo "$TAG" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
            echo "Error: tag contains invalid characters. Allowed: A-Za-z0-9_.-"
            exit 1
          fi

          if [ "$INPUT_LATEST" = "true" ]; then
            PUSH_LATEST=true
          else
            PUSH_LATEST=false
          fi

          {
            echo "TAG_LIST<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-${VARIANT}:${TAG}"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-${VARIANT}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "VARIANT=$VARIANT"
            echo "TAG=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          context: .
          file: Dockerfile.${{ steps.vars.outputs.VARIANT }}
          tags: ${{ steps.vars.outputs.TAG_LIST }}
