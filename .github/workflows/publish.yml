name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      dockerfile_variant:
        description: "Dockerfileの種類"
        required: true
        type: choice
        options:
          - node
      tag:
        description: "Dockerイメージのタグ (省略時は YYMMDD)"
        required: false
        default: ""
      latest:
        description: "latestタグを追加するか"
        required: false
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up variables
        id: vars
        env:
          INPUT_DOCKERFILE_VARIANT: ${{ github.event.inputs.dockerfile_variant }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_LATEST: ${{ github.event.inputs.latest }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          VARIANT="$INPUT_DOCKERFILE_VARIANT"
          DATE=$(date "+%y%m%d")

          if [ -z "$INPUT_TAG" ]; then
            TAG="$DATE"
          else
            TAG="$INPUT_TAG"
          fi

          if ! echo "$TAG" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
            echo "Error: tag contains invalid characters. Allowed: A-Za-z0-9_.-"
            exit 1
          fi

          if [ "$INPUT_LATEST" = "true" ]; then
            PUSH_LATEST=true
          else
            PUSH_LATEST=false
          fi

          {
            echo "TAG_LIST<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-${VARIANT}:${TAG}"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-${VARIANT}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "VARIANT=$VARIANT"
            echo "TAG=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build and push to local registry
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          context: .
          file: Dockerfile.${{ steps.vars.outputs.VARIANT }}
          tags: localhost:5000/devcontainer-${{ steps.vars.outputs.VARIANT }}:${{ steps.vars.outputs.TAG }}

      - name: Scan image with Trivy (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: localhost:5000/devcontainer-${{ steps.vars.outputs.VARIANT }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          cache: false

      - name: Scan image with Trivy (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: localhost:5000/devcontainer-${{ steps.vars.outputs.VARIANT }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          cache: false

      - name: Publish scanned image to GHCR
        env:
          TAG_LIST: ${{ steps.vars.outputs.TAG_LIST }}
          SOURCE: localhost:5000/devcontainer-${{ steps.vars.outputs.VARIANT }}@${{ steps.build.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAG_LIST"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
